# Swift Sport on the MobKazi VPS. Coolify's Traefik (coolify-proxy) routes the domain
# to these containers over mobkazi-network and gets Let's Encrypt certificates, like the
# other MobKazi client sites. No host ports are published.
#   cd /srv/swiftsport && docker compose up -d --build
name: swiftsport

services:
  # Service names are prefixed: they become DNS names on the shared mobkazi-network
  # (which already has a 'db', the main MobKazi Postgres).
  swiftsport-db:
    image: postgres:16-alpine
    container_name: mobkazi-swiftsport-db
    env_file: .env
    volumes:
      - swiftsport-db-data:/var/lib/postgresql/data
    networks: [swiftsport-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  swiftsport-web:
    build: .
    image: mobkazi-swiftsport:latest
    container_name: mobkazi-swiftsport-web
    env_file: .env
    depends_on:
      swiftsport-db:
        condition: service_healthy
    volumes:
      - swiftsport-media:/app/media
    networks: [swiftsport-internal, mobkazi-network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=mobkazi-network
      - traefik.http.services.swiftsport.loadbalancer.server.port=8000
      # https://swiftsport.co.ke
      - traefik.http.routers.swiftsport.rule=Host(`swiftsport.co.ke`)
      - traefik.http.routers.swiftsport.entrypoints=https
      - traefik.http.routers.swiftsport.priority=2100
      - traefik.http.routers.swiftsport.tls=true
      - traefik.http.routers.swiftsport.tls.certresolver=letsencrypt
      - traefik.http.routers.swiftsport.service=swiftsport
      # https://www.swiftsport.co.ke -> https://swiftsport.co.ke
      - traefik.http.routers.swiftsport-www.rule=Host(`www.swiftsport.co.ke`)
      - traefik.http.routers.swiftsport-www.entrypoints=https
      - traefik.http.routers.swiftsport-www.priority=2100
      - traefik.http.routers.swiftsport-www.tls=true
      - traefik.http.routers.swiftsport-www.tls.certresolver=letsencrypt
      - traefik.http.routers.swiftsport-www.middlewares=swiftsport-www-to-apex
      - traefik.http.routers.swiftsport-www.service=swiftsport
      - traefik.http.middlewares.swiftsport-www-to-apex.redirectregex.regex=^https?://www\.swiftsport\.co\.ke/(.*)
      - traefik.http.middlewares.swiftsport-www-to-apex.redirectregex.replacement=https://swiftsport.co.ke/$${1}
      - traefik.http.middlewares.swiftsport-www-to-apex.redirectregex.permanent=true
      # http:// -> https:// (Let's Encrypt HTTP challenges are still answered by Traefik first)
      - traefik.http.routers.swiftsport-http.rule=Host(`swiftsport.co.ke`) || Host(`www.swiftsport.co.ke`)
      - traefik.http.routers.swiftsport-http.entrypoints=http
      - traefik.http.routers.swiftsport-http.middlewares=swiftsport-to-https
      - traefik.http.routers.swiftsport-http.service=swiftsport
      - traefik.http.middlewares.swiftsport-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.swiftsport-to-https.redirectscheme.permanent=true
    restart: always

  swiftsport-media:
    image: nginx:alpine
    container_name: mobkazi-swiftsport-media
    volumes:
      - swiftsport-media:/usr/share/nginx/html/media:ro
      - ./deploy/media-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [mobkazi-network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=mobkazi-network
      - traefik.http.services.swiftsport-media.loadbalancer.server.port=80
      - traefik.http.routers.swiftsport-media.rule=Host(`swiftsport.co.ke`) && PathPrefix(`/media/`)
      - traefik.http.routers.swiftsport-media.entrypoints=https
      - traefik.http.routers.swiftsport-media.priority=3100
      - traefik.http.routers.swiftsport-media.tls=true
      - traefik.http.routers.swiftsport-media.tls.certresolver=letsencrypt
      - traefik.http.routers.swiftsport-media.service=swiftsport-media
    restart: always

networks:
  swiftsport-internal:
  mobkazi-network:
    external: true

volumes:
  swiftsport-db-data:
  swiftsport-media:
